<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de suivi en classe</title>
<style>
/* Layout : un carnet quadrillé sur tablette — barre d'onglets collante, grille de fiches élèves tapables, tableaux de profils. */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --grid:#e3e8f3; --ink:#1b2233; --muted:#5d6782; --line:#d5dbe8;
  --accent:#2448a6; --accent-soft:#e4eafb; --on-accent:#ffffff;
  --ok:#1f7a4d; --ok-soft:#dcf2e6; --warn:#a86200; --warn-soft:#fdeed3; --bad:#b3261e; --bad-soft:#fbe0de; --off:#8b93a8; --off-soft:#eceef4; --corr:#e3b505; --on-corr:#2a2100;
  --f-display:"Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif;
  --f-body:-apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --f-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10131b; --sheet:#181c27; --grid:#1d2230; --ink:#e7eaf3; --muted:#9aa3bb; --line:#2b3243;
  --accent:#8ea8ff; --accent-soft:#232c4a; --on-accent:#0e1426;
  --ok:#5fd39a; --ok-soft:#173226; --warn:#f0b45a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1d1b; --off:#7c849b; --off-soft:#232836; --corr:#f0cd4b; --on-corr:#1f1800; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10131b; --sheet:#181c27; --grid:#1d2230; --ink:#e7eaf3; --muted:#9aa3bb; --line:#2b3243;
  --accent:#8ea8ff; --accent-soft:#232c4a; --on-accent:#0e1426;
  --ok:#5fd39a; --ok-soft:#173226; --warn:#f0b45a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1d1b; --off:#7c849b; --off-soft:#232836; --corr:#f0cd4b; --on-corr:#1f1800; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;margin:0;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted);min-height:40px}
.tab[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.status.warn{color:var(--warn)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0}
.lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 14px;min-height:42px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:4px 10px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.68rem;padding:2px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
/* Séance */
.shead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.shead .meta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.alert b{color:var(--bad)} .stat.watch b{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--line)}
.card.s-ok{border-left-color:var(--ok)} .card.s-warn{border-left-color:var(--warn)} .card.s-bad{border-left-color:var(--bad)}
.card.abs{opacity:.55;border-left-color:var(--off)}
.ctop{display:flex;align-items:center;gap:8px}
.cname{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-height:40px;font-size:.9rem;font-weight:700;color:var(--muted);padding:4px}
.chip[aria-pressed="true"].c-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip[aria-pressed="true"].c-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip[aria-pressed="true"].c-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.exs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ex{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:.85rem;color:var(--muted);padding:0}
.ex.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plus{margin-left:auto;min-width:56px}
.since{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.since.stale{color:var(--warn);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-height:34px;padding:2px 9px;font-size:.8rem;font-weight:700;color:var(--muted)}
.iconbtn[aria-pressed="true"]{background:var(--off-soft);color:var(--ink);border-color:var(--off)}
.iconbtn.has{color:var(--accent);border-color:var(--accent)}
textarea{width:100%;min-height:64px;resize:vertical}
.list{display:flex;flex-direction:column}
.litem{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.litem:first-child{border-top:0}
.litem .grow{flex:1;min-width:180px}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
/* Profils */
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--paper);position:sticky;top:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
.bar{height:8px;border-radius:4px;background:var(--off-soft);width:90px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;gap:3px}
.sq{width:16px;height:16px;border-radius:4px;background:var(--off-soft);border:1px solid var(--line)}
.sq.q-ok{background:var(--ok);border-color:var(--ok)} .sq.q-warn{background:var(--warn);border-color:var(--warn)} .sq.q-bad{background:var(--bad);border-color:var(--bad)}
.sq.q-abs{background:repeating-linear-gradient(45deg,var(--off-soft) 0 3px,var(--line) 3px 6px)}
.prof{font-weight:700;font-size:.85rem;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-off{background:var(--off-soft);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.mini{font-size:.86rem}
.trend{font-family:var(--f-mono);font-size:.8rem}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.picklab{width:70px}
.pick{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-weight:500;position:relative;padding:0 8px;color:var(--ink)}
.pick.act{border-style:dashed}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent)}
.pick.seen::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.pick[aria-pressed="true"].seen::after{background:var(--on-accent)}
.ex.wide{width:auto;min-width:40px;padding:0 10px;border-radius:20px}
table.mx{min-width:0;width:auto}
.mx td,.mx th{padding:5px 3px;text-align:center;font-family:var(--f-mono);font-size:.8rem}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--sheet);z-index:1;padding-left:12px;min-width:160px;font-family:var(--f-body);font-size:.95rem}
.mx th:first-child{background:var(--paper);z-index:3}
.mx th.vu{color:var(--accent)}
.cell{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-size:.8rem;font-weight:700;padding:0;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.legend .cell{width:22px;height:22px;font-size:.7rem}
.cell.k-fait{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.k-hors{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.k-nonfini{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cell.k-abs{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:700;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ex.st-a{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ex.st-i{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.ex.st-c{background:var(--corr);border-color:var(--corr);color:var(--on-corr)}
.mdot.st-c{background:var(--corr);border-color:var(--corr)}
.cell.k-corr{background:var(--corr);border-color:var(--corr);color:var(--on-corr)}
.ex.st-n{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.mdot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);vertical-align:middle}
.mdot.st-a{background:var(--accent);border-color:var(--accent)} .mdot.st-i{background:var(--ok);border-color:var(--ok)} .mdot.st-n{background:var(--bad);border-color:var(--bad)}
.mdots{display:inline-flex;gap:3px;flex-wrap:wrap}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flag{border:1px dashed var(--line);background:none;border-radius:99px;font-size:.78rem;padding:3px 10px;min-height:32px;color:var(--muted);font-weight:700}
.flag[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.cell.k-aide{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.cell.k-nonch{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
@media (max-width:560px){.brand small{display:none}.tab{padding:8px 10px}}
@media (prefers-reduced-motion:no-preference){.chip,.ex,.tab{transition:background .12s,border-color .12s,color .12s}}
</style>

</head>
<body>
<header>
  <div class="wrap hbar">
    <h1 class="brand">Carnet de suivi <small>en classe</small></h1>
    <nav class="tabs" aria-label="Vues">
      <button class="tab" data-act="view" data-v="seance" id="tab-seance">Séance</button>
      <button class="tab" data-act="view" data-v="chapitre" id="tab-chapitre">Chapitre</button>
      <button class="tab" data-act="view" data-v="profils" id="tab-profils">Profils</button>
      <button class="tab" data-act="view" data-v="classes" id="tab-classes">Classes</button>
    </nav>
    <span class="spacer"></span>
    <label class="field" style="flex-direction:row;align-items:center;gap:8px"><span class="lab">Classe</span>
      <select id="sel-classe" data-act="classe"></select></label>
    <span class="status" id="status">Chargement…</span>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Chargement de vos classes…</div></main>

<script>
(function(){
const DEM={r:['Rapide','c-ok'],l:['Lent','c-warn'],n:['Pas lancé','c-bad']};
const AUTO={a:['Autonome','c-ok'],i:['Aidé','c-warn'],b:['Bloqué','c-bad']};
const ST={a:['Seul, juste','st-a'],i:['Aidé','st-i'],c:['Correction copiée','st-c'],n:['Pas cherché','st-n']};
const DEF_FLAGS=['Bavardage','Matériel oublié','Retard','Téléphone'];
const flagsOf=c=>(c&&c.flags&&c.flags.length)?c.flags:DEF_FLAGS;
function stOf(o,id){const v=o.st&&o.st[id];if(v)return v;return (o.done||[]).includes(id)?'a':''}
function stCount(o){const r={a:0,i:0,c:0,n:0};Object.values(o.st||{}).forEach(x=>{if(x in r)r[x]++});return r}
function autoOf(o){const v=Object.values(o.st||{});if(v.length)return v.reduce((a,x)=>a+({a:1,i:.5,c:.25,n:0}[x]||0),0)/v.length;return o.auto?{a:1,i:.5,b:0}[o.auto]:null}
const fmtFl=fl=>Object.entries(fl||{}).sort((a,b)=>b[1]-a[1]).map(([k,n])=>esc(k)+' ×'+n).join(', ');
const S={classes:{},seances:{},chapitres:{},chapId:null,chStudent:null,newChap:false,form:{},pick:[],view:'seance',classId:null,seanceId:null,sort:'alpha',seuil:10,profil:null,
  loaded:{classes:false,seances:false,chapitres:false},mode:'wait',confirm:null,openNote:null,editClass:null,err:null};
const PREF='suivi-hl-prefs', LOCAL='suivi-hl-donnees';
try{Object.assign(S,JSON.parse(localStorage.getItem(PREF)||'{}'))}catch(e){}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify({view:S.view,classId:S.classId,seanceId:S.seanceId,chapId:S.chapId,sort:S.sort,seuil:S.seuil}))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>{try{return new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch(e){return s}};
const coll=c=>S[c];

/* ---------- Stockage : base de l'artefact, sinon local ---------- */
let db=null; const timers={}, chains={}, gen={}, dirty=new Set(); let pending=0;
function setStatus(){
  const el=$('status');
  if(S.err){el.textContent=S.err;el.className='status warn';return}
  if(S.mode==='wait'){el.textContent='Chargement…';el.className='status';return}
  if(S.mode==='local'){el.textContent=pending?'Enregistrement…':'Enregistré sur cet iPad';el.className='status';return}
  el.textContent=pending?'Enregistrement…':'Enregistré';el.className='status';
}
function save(c,id){
  const k=c+'/'+id; dirty.add(k); gen[k]=(gen[k]||0)+1; const g=gen[k];
  if(timers[k]){clearTimeout(timers[k]);delete timers[k]}else pending++; setStatus();
  timers[k]=setTimeout(()=>{
    delete timers[k];
    chains[k]=(chains[k]||Promise.resolve()).then(async()=>{
      const o=coll(c)[id]; if(!o)return;
      const body=JSON.parse(JSON.stringify(o)); delete body.id;
      if(db) await db.doc(k).set(body); else saveLocal();
      S.err=null;
    }).catch(e=>{S.err='Échec de l’enregistrement, réessayez';console.error(e)})
    .finally(()=>{pending=Math.max(0,pending-1); if(gen[k]===g)dirty.delete(k); setStatus()});
  },150);
}
async function remove(c,id){
  const k=c+'/'+id; if(timers[k]){clearTimeout(timers[k]);delete timers[k];pending=Math.max(0,pending-1)} delete coll(c)[id];
  try{ if(db) await db.doc(k).delete(); else saveLocal(); }catch(e){S.err='Suppression impossible';console.error(e)}
  setStatus();
}
function saveLocal(){try{localStorage.setItem(LOCAL,JSON.stringify({classes:S.classes,seances:S.seances,chapitres:S.chapitres}));S.lastSave=Date.now()}catch(e){S.err='Enregistrement impossible : stockage de l’iPad plein ou bloqué';throw e}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LOCAL)||'{}');S.classes=d.classes||{};S.seances=d.seances||{};S.chapitres=d.chapitres||{}}catch(e){}}
function applySnap(c,snap){
  const next={};
  snap.docs.forEach(d=>{const k=c+'/'+d.id; next[d.id]=dirty.has(k)&&coll(c)[d.id]?coll(c)[d.id]:Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()||{})))});
  Object.keys(coll(c)).forEach(id=>{if(dirty.has(c+'/'+id)&&!next[id])next[id]=coll(c)[id]});
  S[c]=next;
  if(!snap.metadata.fromCache)S.loaded[c]=true;
  render();
}
function init(){
  S.mode='local'; loadLocal(); S.loaded={classes:true,seances:true,chapitres:true}; render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}

/* ---------- Calculs ---------- */
const classSeances=cid=>Object.values(S.seances).filter(s=>s.classId===cid).sort((a,b)=>(a.date+(a.debut||0))<(b.date+(b.debut||0))?-1:1);
const sortedStudents=c=>(c&&c.eleves||[]).slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
const enCours=s=>s&&!s.fin&&s.debut&&(Date.now()-s.debut)<4*3600e3;
const concerne=(s,e)=>!s.groupe||(e&&e.groupe)===s.groupe;
const grpLabel=g=>g?'Groupe '+g:'Classe entière';
function obsOf(s,sid){return (s.obs&&s.obs[sid])||{}}
function minsSince(s,o){const t=o.tEx||s.debut;return t?Math.floor((Date.now()-t)/60000):null}
function isStale(s,o){return enCours(s)&&!o.abs&&(o.ex||0)<s.nbEx&&minsSince(s,o)>=S.seuil}
function cardState(s,o){

const DEF_CONSIGNE="Rédige pour chaque élève une appréciation de bulletin de mathématiques (2 à 3 phrases, environ 250 caractères), bienveillante et précise, en t’appuyant uniquement sur ces observations du travail en classe. Commence chaque appréciation par le code de l’élève suivi de deux-points, une appréciation par ligne.";
function schoolStart(){const d=new Date();const y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return y+'-08-01'}
function ensureCodes(c){

  const sans=(c.eleves||[]).filter(e=>!c.codes[e.id]);
  for(let i=sans.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sans[i],sans[j]]=[sans[j],sans[i]]}
  let n=1;sans.forEach(e=>{let code;do{code='E'+String(n++).padStart(2,'0')}while(used.has(code));used.add(code);c.codes[e.id]=code;changed=true});
  if(changed)save('classes',c.id);return c.codes;
}
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function maskNames(txt,c,codes){

function vAppr(){
  const f=S.form,c=S.classes[S.classId];
  return `<section class="panel"><div class="row"><h3 style="flex:1">Préparer les appréciations</h3><button class="btn small" data-act="appr">Fermer</button></div>
    <p class="mini muted" style="margin:0">Le texte ci-dessous ne contient aucun nom : chaque élève a un code (E01…), tiré au hasard et gardé sur cet appareil. Les prénoms et noms écrits dans vos remarques sont remplacés par le code. Relisez quand même les remarques avant de copier.</p>
    <div class="row" style="align-items:flex-end">
      <label class="field"><span class="lab">Du</span><input type="date" id="ap-from" data-form="apfrom" value="${esc(f.apfrom||schoolStart())}"></label>
      <label class="field"><span class="lab">Au</span><input type="date" id="ap-to" data-form="apto" value="${esc(f.apto||today())}"></label>
      <label class="field"><span class="lab">Vos remarques</span><select id="ap-notes" data-form="apnotes"><option value="1"${f.apnotes!=='0'?' selected':''}>Incluses</option><option value="0"${f.apnotes==='0'?' selected':''}>Exclues</option></select></label>
      <button class="btn" data-act="apgen">Mettre à jour</button></div>
    <label class="field"><span class="lab">Consigne pour Claude (modifiable)</span><textarea id="ap-consigne" data-form="apconsigne" data-keep="1" style="min-height:70px">${esc(f.apconsigne??DEF_CONSIGNE)}</textarea></label>
    <label class="field"><span class="lab">Texte à copier</span><textarea id="ap-text" readonly style="min-height:220px;font-family:var(--f-mono);font-size:.82rem">${esc(apprText())}</textarea></label>
    <div class="row"><button class="btn pri" data-act="apcopy" data-src="ap-text">Copier le texte</button>${typeof saveFile==='function'?'<button class="btn" data-act="apsave">Enregistrer en fichier</button>':''}<span class="mini muted" id="ap-msg-ap-text"></span></div>
  </section>
  <section class="panel"><h3>Remettre les noms</h3>
    <p class="mini muted" style="margin:0">Collez ici les appréciations rédigées avec les codes : les codes sont remplacés par les noms des élèves de ${esc(c.nom)}, sur cet appareil.</p>
    <textarea id="ap-in" data-keep="1" style="min-height:120px" placeholder="E01 : Élève sérieux…">${esc(S.apIn||'')}</textarea>
    <div class="row"><button class="btn pri" data-act="aprename">Remettre les noms</button>${S.apMiss?`<span class="mini" style="color:var(--warn)">${S.apMiss} code${S.apMiss>1?'s':''} inconnu${S.apMiss>1?'s':''} laissé${S.apMiss>1?'s':''} tel${S.apMiss>1?'s':''} quel${S.apMiss>1?'s':''}.</span>`:''}</div>
    ${S.apOut!=null?`<textarea id="ap-out" readonly style="min-height:160px">${esc(S.apOut)}</textarea><div class="row"><button class="btn" data-act="apcopy" data-src="ap-out">Copier</button><span class="mini muted" id="ap-msg-ap-out"></span></div>`:''}
  </section>`;
}

/* ---------- Rendu ---------- */
function render(){
  const ae=document.activeElement; if(ae&&ae.dataset&&ae.dataset.keep&&$('main').contains(ae)){S.deferred=true;setStatus();return}
  setStatus();
  ['seance','chapitre','profils','classes'].forEach(v=>$('tab-'+v).setAttribute('aria-pressed',S.view===v));
  const ids=Object.values(S.classes).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  if(!S.classes[S.classId])S.classId=ids[0]?ids[0].id:null;
  $('sel-classe').innerHTML=ids.length?ids.map(c=>`<option value="${c.id}"${c.id===S.classId?' selected':''}>${esc(c.nom)}</option>`).join(''):'<option>Aucune classe</option>';
  $('sel-classe').disabled=!ids.length;
  const m=$('main');
  if(S.mode==='wait'||(S.mode==='db'&&!S.loaded.classes&&!ids.length)){m.innerHTML='<div class="empty">Chargement de vos classes…</div>';return}
  if(!ids.length&&S.view!=='classes'){m.innerHTML=`<div class="panel empty"><h2>Commencez par créer une classe</h2><p>Collez la liste de vos élèves, un nom par ligne. Vous pourrez ensuite lancer une séance et noter le travail de chacun.</p><div><button class="btn pri" data-act="view" data-v="classes">Créer une classe</button></div></div>`;return}
  m.innerHTML=S.view==='seance'?vSeance():S.view==='chapitre'?vChapitre():S.view==='profils'?vProfils():vClasses();
  savePrefs();
}
function exBadge(c){return c&&c.exemple?' <span class="tag">exemple</span>':''}

function vSeance(){
  const c=S.classes[S.classId]; const s=S.seances[S.seanceId];
  if(!s||s.classId!==S.classId)return vSeanceList(c);
  if(!s.items)ensureItems(s);
  const st=sortedStudents(c).filter(e=>concerne(s,e)); let list=st.map(e=>({e,o:obsOf(s,e.id)}));
  if(S.sort==='watch'){const pr=x=>{if(x.o.abs)return 9;const k=cardState(s,x.o);return k==='bad'?0:isStale(s,x.o)?1:!x.o.dem?2:k==='warn'?3:5};list.sort((a,b)=>pr(a)-pr(b)||a.e.nom.localeCompare(b.e.nom,'fr'))}
  const pres=list.filter(x=>!x.o.abs); const n=pres.length;
  const lances=pres.filter(x=>x.o.dem==='r'||x.o.dem==='l').length, bloq=pres.filter(x=>x.o.auto==='b'||stCount(x.o).n).length, nfl=pres.reduce((a,x)=>a+(x.o.flags||[]).length,0);
  const stale=pres.filter(x=>isStale(s,x.o)).length, nonl=pres.filter(x=>x.o.dem==='n').length;
  const moy=n&&s.nbEx?pres.reduce((a,x)=>a+Math.min(1,(x.o.ex||0)/s.nbEx),0)/n:0;
  const dur=s.debut?Math.floor(((s.fin||Date.now())-s.debut)/60000):0;
  const live=enCours(s);
  return `<section class="shead">
    <div class="field"><span class="lab">${esc(c.nom)} · ${grpLabel(s.groupe)} · ${fdate(s.date)}${exBadge(s)}</span><h2>${esc(s.titre)}</h2>
      <span class="meta">${s.items?(s.chapId?esc((S.chapitres[s.chapId]||{}).titre||'Chapitre')+' · ':'')+esc(fmtItems(s.items)):s.nbEx+' exercice'+(s.nbEx>1?'s':'')} · ${live?'en cours depuis '+dur+' min':s.fin?'terminée ('+dur+' min)':'séance passée'}</span></div>
    <div class="row">
      <label class="field"><span class="lab">Ordre</span><select id="sel-sort" data-act="sort"><option value="alpha"${S.sort==='alpha'?' selected':''}>Alphabétique</option><option value="watch"${S.sort==='watch'?' selected':''}>À surveiller d’abord</option></select></label>
      <label class="field"><span class="lab">Alerte sans progrès</span><select id="sel-seuil" data-act="seuil">${[5,8,10,15,20].map(v=>`<option value="${v}"${S.seuil==v?' selected':''}>${v} min</option>`).join('')}</select></label>
      <button class="btn" data-act="leave">Toutes les séances</button>
      ${live?'<button class="btn" data-act="finish">Terminer</button>':s.fin?'<button class="btn" data-act="reopen">Reprendre</button>':''}
    </div></section>
  <section class="stats" aria-label="Résumé">
    <div class="stat"><span class="lab">Présents</span><b>${n}<span class="muted" style="font-size:1rem"> / ${st.length}</span></b></div>
    <div class="stat"><span class="lab">Au travail</span><b>${lances}</b></div>
    <div class="stat ${nonl?'alert':''}"><span class="lab">Pas lancés</span><b>${nonl}</b></div>
    <div class="stat ${bloq?'alert':''}"><span class="lab">Exercice pas cherché</span><b>${bloq}</b></div>
    <div class="stat ${nfl?'watch':''}"><span class="lab">Signalements</span><b>${nfl}</b></div>
    <div class="stat ${stale?'watch':''}"><span class="lab">Sans progrès ≥ ${S.seuil} min</span><b>${live?stale:'—'}</b></div>
    <div class="stat"><span class="lab">Avancement moyen</span><b>${Math.round(moy*100)} %</b></div>
  </section>
  <div class="legend"><span>Touchez un numéro, puis encore pour changer :</span><span><i class="mdot st-a"></i>seul, juste</span><span><i class="mdot st-i"></i>aidé</span><span><i class="mdot st-c"></i>correction copiée</span><span><i class="mdot st-n"></i>pas cherché</span><span><i class="mdot"></i>effacé</span></div>
  <section class="grid">${list.map(x=>card(s,x.e,x.o)).join('')||`<div class="empty">${s.groupe?'Aucun élève n’est rattaché au groupe '+s.groupe+'. Répartissez les élèves dans l’onglet Classes.':'Aucun élève dans cette classe.'}</div>`}</section>`;
}
function card(s,e,o){
  const k=cardState(s,o), ex=o.ex||0, m=minsSince(s,o), stale=isStale(s,o);
  const seg=(f,map)=>`<div class="seg">${Object.entries(map).map(([v,[t,cl]])=>`<button class="chip ${cl}" data-act="set" data-f="${f}" data-v="${v}" data-sid="${e.id}" aria-pressed="${o[f]===v}"${o.abs?' disabled':''}>${t}</button>`).join('')}</div>`;
  let since='';
  if(!o.abs&&ex>=s.nbEx&&s.nbEx)since='<span class="since">Tout terminé</span>';
  else if(!o.abs&&enCours(s)&&m!=null)since=`<span class="since${stale?' stale':''}">${ex?'Dernière avancée':'Depuis le début'} : ${m} min${stale?' · à voir':''}</span>`;
  const note=S.openNote===e.id;
  return `<article class="card ${k==='abs'?'abs':k?'s-'+k:''}">
    <div class="ctop"><span class="cname">${esc(e.nom)}</span>
      <button class="iconbtn${o.note?' has':''}" data-act="note" data-sid="${e.id}" aria-pressed="${note}">Note${o.note?' •':''}</button>
      <button class="iconbtn" data-act="abs" data-sid="${e.id}" aria-pressed="${!!o.abs}">Absent</button></div>
    ${o.abs?'':`<div class="flags">${flagsOf(S.classes[s.classId]).map(f=>`<button class="flag" data-act="flag" data-f="${esc(f)}" data-sid="${e.id}" aria-pressed="${(o.flags||[]).includes(f)}">${esc(f)}</button>`).join('')}</div>
    <div class="field"><span class="lab">Mise en route</span>${seg('dem',DEM)}</div>
    <div class="field"><span class="lab">Exercices · ${ex} / ${s.nbEx} faits</span>
      <div class="exs">${dots(s,e,o)}
      <button class="btn small plus" data-act="plus" data-sid="${e.id}"${(s.items||[]).every(it=>stOf(o,it.id))?' disabled':''}>+1</button></div>${since}</div>`}
    ${note?`<textarea id="note-${e.id}" data-keep="1" data-act="notein" data-sid="${e.id}" placeholder="Remarque pour cette séance">${esc(o.note)}</textarea>`:(o.note?`<span class="mini muted">${esc(o.note)}</span>`:'')}
  </article>`;
}
function vSeanceList(c){
  const ss=classSeances(S.classId).reverse(); const conf=S.confirm;
  let last=null;try{last=+localStorage.getItem('suivi-hl-lastbackup')||0}catch(e){}
  const remind=Object.keys(S.seances).length&&(!last||Date.now()-last>7*864e5)?`<div class="panel" style="flex-direction:row;flex-wrap:wrap;align-items:center;border-color:var(--warn)"><span style="flex:1;min-width:200px">${last?'Votre dernière sauvegarde date de plus d’une semaine.':'Vous n’avez encore fait aucune sauvegarde.'}</span><button class="btn" data-act="backup">Sauvegarder maintenant</button></div>`:'';
  return `${remind}${formSeance(c)}
  <section class="panel"><h3>Séances de ${esc(c.nom)}</h3>
    ${ss.length?`<div class="list">${ss.map(s=>{const pr=sortedStudents(c).filter(e=>concerne(s,e)&&!obsOf(s,e.id).abs);const n=pr.length;const av=n&&s.nbEx?Math.round(pr.reduce((a,e)=>a+Math.min(1,(obsOf(s,e.id).ex||0)/s.nbEx),0)/n*100):0;
      return `<div class="litem"><div class="grow"><b>${esc(s.titre)}</b>${exBadge(s)}<div class="mini muted">${fdate(s.date)} · ${grpLabel(s.groupe)} · ${s.nbEx} ex. · avancement moyen ${av} %${enCours(s)?' · <b style="color:var(--accent)">en cours</b>':''}</div></div>
      ${conf===s.id?`<span class="confirm">Supprimer cette séance ? <button class="btn small danger" data-act="delseance" data-id="${s.id}">Supprimer</button><button class="btn small" data-act="cancel">Annuler</button></span>`:
      `<button class="btn" data-act="open" data-id="${s.id}">Ouvrir</button><button class="btn small" data-act="ask" data-id="${s.id}">Supprimer</button>`}</div>`}).join('')}</div>`:'<p class="muted">Aucune séance pour l’instant.</p>'}
  </section>`;
}
function vProfils(){
  const c=S.classes[S.classId]; const st=sortedStudents(c); const ss=classSeances(S.classId);
  if(!ss.length)return `<div class="panel empty"><h2>Pas encore de séance</h2><p>Les profils apparaissent après quelques séances suivies.</p></div>`;
  const rows=st.map(e=>({e,p:profile(S.classId,e.id)}));
  const sel=S.profil&&rows.find(r=>r.e.id===S.profil);
  return `<section class="shead"><div class="field"><span class="lab">${esc(c.nom)} · ${ss.length} séance${ss.length>1?'s':''}</span><h2>Profils de travail</h2></div>
    <div class="row"><button class="btn" data-act="csv">Exporter en CSV</button><button class="btn pri" data-act="appr">Préparer les appréciations</button></div></section>
  ${S.appr?vAppr():''}
  <div class="legend"><span><i class="sq q-ok"></i>séance efficace</span><span><i class="sq q-warn"></i>moyenne</span><span><i class="sq q-bad"></i>difficile</span><span><i class="sq q-abs"></i>absent</span><span><i class="sq"></i>non noté</span><span>Touchez un élève pour le détail.</span></div>
  <div class="tablewrap"><table><thead><tr><th>Élève</th><th>Séances</th><th>Mise en route</th><th>Autonomie</th><th>Avancement moyen</th><th>Évolution</th><th>Signalements</th><th>Historique</th><th>Profil</th></tr></thead><tbody>
  ${rows.map(({e,p})=>`<tr class="click${S.profil===e.id?' sel':''}" data-act="profil" data-sid="${e.id}" tabindex="0">
    <td><b>${esc(e.nom)}</b>${e.groupe?` <span class="muted mini">G${e.groupe}</span>`:''}</td><td>${p.pres}${p.abs?` <span class="muted mini">+${p.abs} abs.</span>`:''}</td>
    <td>${pct(p.dem)}</td><td>${pct(p.auto)}</td>
    <td><span class="bar"><i style="width:${Math.round((p.av||0)*100)}%"></i></span>${pct(p.av)}</td>
    <td class="trend">${p.trend==null?'—':(p.trend>.08?'↗ progresse':p.trend<-.08?'↘ recule':'→ stable')}</td>
    <td class="mini">${fmtFl(p.fl)||'<span class="muted">—</span>'}</td>
    <td><div class="hist">${p.hist.map(h=>`<i class="sq ${h.q?'q-'+h.q:''}" title="${esc(h.s.titre)} · ${fdate(h.s.date)}"></i>`).join('')}</div></td>
    <td><span class="prof ${p.label[1]}">${p.label[0]}</span></td></tr>`).join('')}
  </tbody></table></div>
  ${sel?detail(sel.e,ss):''}
  <p class="mini muted">Mise en route : Rapide = 100 %, Lent = 50 %, Pas lancé = 0. Autonomie : moyenne des exercices coloriés, bleu (seul, juste) = 100 %, vert (aidé) = 50 %, jaune (correction copiée) = 25 %, rouge (pas cherché) = 0. Avancement = exercices faits ÷ exercices prévus. Le profil se calcule à partir de deux séances notées.</p>`;
}
function detail(e,ss){
  return `<section class="panel"><div class="row"><h3 style="flex:1">${esc(e.nom)} · séance par séance</h3><button class="btn small" data-act="profil" data-sid="${e.id}">Fermer</button></div>
  <div class="tablewrap" style="border:0"><table style="min-width:620px"><thead><tr><th>Date</th><th>Séance</th><th>Mise en route</th><th>Exercices</th><th>Faits</th><th>Signalements et note</th></tr></thead><tbody>
  ${ss.filter(s=>concerne(s,e)).reverse().map(s=>{const o=obsOf(s,e.id);const pill=(m,v)=>v?`<span class="prof ${m[v][1].replace('c-','p-')}">${m[v][0]}</span>`:'<span class="muted">—</span>';
    return `<tr><td>${fdate(s.date)}</td><td>${esc(s.titre)}</td>${o.abs?'<td colspan="3"><span class="prof p-off">Absent</span></td>':`<td>${pill(DEM,o.dem)}</td><td>${s.items?`<span class="mdots">${s.items.map(it=>{const v=stOf(o,it.id);return `<i class="mdot ${v?ST[v][1]:''}" title="${esc(itFull(it))}${v?' · '+ST[v][0]:''}"></i>`}).join('')}</span>`:pill(AUTO,o.auto)}</td><td>${o.ex||0} / ${s.nbEx}</td>`}<td class="mini">${(o.flags||[]).map(f=>`<span class="prof p-warn">${esc(f)}</span>`).join(' ')} ${esc(o.note||'')}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
}
function backupPanel(){
  let last=null;try{last=+localStorage.getItem('suivi-hl-lastbackup')||null}catch(e){}
  const days=last?Math.floor((Date.now()-last)/864e5):null; const pi=S.pendingImport;
  const n=o=>Object.keys(o||{}).length;
  return `<section class="panel"><h3>Sauvegarde</h3>
    <p class="mini muted" style="margin:0">Vos données restent sur cet iPad et ne passent jamais par internet. Si vous supprimez l’icône de l’écran d’accueil, elles sont effacées : faites une sauvegarde régulièrement et rangez le fichier dans l’app Fichiers.</p>
    <p class="mini" style="margin:0">${last?`Dernière sauvegarde : il y a ${days===0?'moins d’un jour':days+' jour'+(days>1?'s':'')}`:'<b style="color:var(--warn)">Aucune sauvegarde pour l’instant.</b>'}</p>
    <div class="row"><button class="btn pri" data-act="backup">Créer une sauvegarde</button>
      <label class="btn" for="f-restore" style="display:inline-flex;align-items:center">Restaurer une sauvegarde</label>
      <input type="file" id="f-restore" accept=".json,application/json" hidden></div>
    ${pi?`<div class="confirm">Remplacer toutes les données de l’iPad par cette sauvegarde (${n(pi.classes)} classes, ${n(pi.seances)} séances, du ${esc((pi.exporte||'').slice(0,10))}) ?
      <button class="btn small danger" data-act="doimport">Remplacer</button><button class="btn small" data-act="noimport">Annuler</button></div>`:''}
    ${S.msg?`<p class="mini" style="margin:0;color:var(--accent)">${esc(S.msg)}</p>`:''}
  </section>`;
}
function vClasses(){
  const ids=Object.values(S.classes).sort((a,b)=>a.nom.localeCompare(b.nom,'fr')); const conf=S.confirm; const ed=S.editClass&&S.classes[S.editClass];
  return `${ed?`<section class="panel"><div class="row"><h2 style="flex:1">${esc(ed.nom)}${exBadge(ed)}</h2><button class="btn" data-act="closeedit">Fermer</button></div>
    <div class="row" style="align-items:flex-end"><label class="field" style="flex:1;min-width:200px"><span class="lab">Nom de la classe</span><input type="text" id="e-nom" value="${esc(ed.nom)}"></label><button class="btn" data-act="rename">Renommer</button></div>
    <div class="row" style="align-items:flex-end"><div class="field" style="flex:1;min-width:200px"><span class="lab">Ajouter des élèves (un par ligne, ou fichier CSV)</span><textarea id="e-add" placeholder="NOM Prénom"></textarea>
      <div class="row"><label class="btn small" for="f-csv-e" style="display:inline-flex;align-items:center">Importer un fichier CSV</label><input type="file" id="f-csv-e" data-target="e-add" accept=".csv,.txt,text/csv,text/plain" hidden><span class="mini muted" id="csvmsg-e-add"></span></div></div><label class="field" style="width:150px"><span class="lab">Groupe</span><select id="e-grp"><option value="0">Aucun</option><option value="1">Groupe 1</option><option value="2">Groupe 2</option></select></label><button class="btn pri" data-act="addst">Ajouter</button></div>
    ${S.addMsg?`<p class="mini" style="margin:0;color:var(--accent)">${esc(S.addMsg)}</p>`:''}
    <div class="row" style="align-items:flex-end"><label class="field" style="flex:1;min-width:200px"><span class="lab">Boutons de signalement (séparés par des virgules)</span><input type="text" id="e-flags" value="${esc(flagsOf(ed).join(', '))}"></label><button class="btn" data-act="setflags">Enregistrer</button></div>
    <p class="mini muted">Groupes : G1 = ${(ed.eleves||[]).filter(e=>e.groupe===1).length} élèves · G2 = ${(ed.eleves||[]).filter(e=>e.groupe===2).length} · sans groupe = ${(ed.eleves||[]).filter(e=>!e.groupe).length}. Une séance en groupe n’affiche que les élèves de ce groupe ; elle ne compte pas dans le profil des autres.</p>
    <div class="list">${sortedStudents(ed).map(e=>`<div class="litem"><span class="grow">${esc(e.nom)}</span><span class="seg" style="width:210px" role="group" aria-label="Groupe">${[[0,'Aucun'],[1,'Groupe 1'],[2,'Groupe 2']].map(([g,t])=>`<button class="chip c-ok" data-act="grp" data-g="${g}" data-sid="${e.id}" aria-pressed="${(e.groupe||0)===g}">${t}</button>`).join('')}</span>${conf==='st-'+e.id?`<span class="confirm">Retirer cet élève ? <button class="btn small danger" data-act="delst" data-sid="${e.id}">Retirer</button><button class="btn small" data-act="cancel">Annuler</button></span>`:`<button class="btn small" data-act="ask" data-id="st-${e.id}">Retirer</button>`}</div>`).join('')}</div></section>`:''}
  <section class="panel"><h2>Nouvelle classe</h2>
    <div class="row" style="align-items:flex-start">
      <label class="field" style="width:200px"><span class="lab">Nom</span><input type="text" id="c-nom" placeholder="1re Spé 3"></label>
      <div class="field" style="flex:1;min-width:220px"><span class="lab">Élèves, un par ligne, ou fichier CSV de Pronote</span><textarea id="c-eleves" style="min-height:120px" placeholder="DUPONT Léa&#10;HOARAU Kévin&#10;…"></textarea>
        <div class="row"><label class="btn small" for="f-csv-c" style="display:inline-flex;align-items:center">Importer un fichier CSV</label><input type="file" id="f-csv-c" data-target="c-eleves" accept=".csv,.txt,text/csv,text/plain" hidden><span class="mini muted" id="csvmsg-c-eleves">Seuls les noms et prénoms sont gardés.</span></div></div><label class="field" style="width:150px"><span class="lab">Groupe</span><select id="c-grp"><option value="0">Aucun</option><option value="1">Groupe 1</option><option value="2">Groupe 2</option></select></label></div>
    <div><button class="btn pri" data-act="newclass">Créer la classe</button></div></section>
  ${backupPanel()}
  <section class="panel"><h3>Vos classes</h3>${ids.length?`<div class="list">${ids.map(c=>`<div class="litem"><div class="grow"><b>${esc(c.nom)}</b>${exBadge(c)}<div class="mini muted">${(c.eleves||[]).length} élèves · ${classSeances(c.id).length} séances</div></div>
    ${conf==='cl-'+c.id?`<span class="confirm">Supprimer la classe et ses séances ? <button class="btn small danger" data-act="delclass" data-id="${c.id}">Supprimer</button><button class="btn small" data-act="cancel">Annuler</button></span>`:`<button class="btn" data-act="edit" data-id="${c.id}">Modifier</button><button class="btn small" data-act="ask" data-id="cl-${c.id}">Supprimer</button>`}</div>`).join('')}</div>`:'<p class="muted">Aucune classe.</p>'}</section>`;
}

/* ---------- Actions ---------- */
function parseRows(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const sample=lines.slice(0,5).join('\n');const d=sample.includes('\t')?'\t':((sample.match(/;/g)||[]).length>=(sample.match(/,/g)||[]).length&&sample.includes(';'))?';':sample.includes(',')&&lines.every(l=>l.includes(','))?',':null;
  if(!d)return lines.map(l=>[l.trim()]);
  return lines.map(l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}
    else if(ch==='"')q=true;else if(ch===d){out.push(cur.trim());cur=''}else cur+=ch}
    out.push(cur.trim());return out});
}
const normH=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function namesFromTable(text){
  const rows=parseRows(text);if(!rows.length)return[];
  const h=rows[0].map(normH);
  const iFull=h.findIndex(x=>x==='eleve'||x==='eleves'||x==='nom et prenom'||x==='nom prenom'||x==='nom prenoms'||x==='nom et prenoms');
  const iPre=h.findIndex(x=>/^prenom/.test(x));
  const iNom=h.findIndex(x=>x==='nom'||x==='nom de famille'||x==='nom d usage'||(x.startsWith('nom')&&!x.includes('prenom')));
  let body=rows,get;
  if(iFull>=0){body=rows.slice(1);get=r=>r[iFull]}
  else if(iNom>=0&&iPre>=0){body=rows.slice(1);get=r=>[r[iNom],r[iPre]].filter(Boolean).join(' ')}
  else if(iNom>=0){body=rows.slice(1);get=r=>r[iNom]}
  else get=r=>r.filter(Boolean).slice(0,r.length>1&&r.filter(Boolean).length>1?2:1).join(' ');
  const seen=new Set();
  return body.map(r=>String(get(r)||'').replace(/\s+/g,' ').trim()).filter(n=>n&&!/^\d+$/.test(n)&&!seen.has(n)&&seen.add(n));
}
const parseNames=t=>namesFromTable(t).map(nom=>({id:uid(),nom}));
function readTextFile(file,cb){
  const r=new FileReader();r.onload=()=>{const t=String(r.result);if(t.includes('\ufffd')){const r2=new FileReader();r2.onload=()=>cb(String(r2.result));r2.readAsText(file,'windows-1252')}else cb(t)};r.readAsText(file,'utf-8');
}
function obsMut(sid){const s=S.seances[S.seanceId];s.obs=s.obs||{};s.obs[sid]=s.obs[sid]||{};return [s,s.obs[sid]]}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;
  const a=b.dataset.act, sid=b.dataset.sid, id=b.dataset.id;
  if(a==='view'){S.view=b.dataset.v;S.confirm=null;render();return}
  if(a==='set'){const [s,o]=obsMut(sid);const f=b.dataset.f;o[f]=o[f]===b.dataset.v?null:b.dataset.v;save('seances',s.id);render();return}
  if(a==='abs'){const [s,o]=obsMut(sid);o.abs=!o.abs;save('seances',s.id);render();return}
  if(a==='tog'||a==='plus'){const [s,o]=obsMut(sid);ensureItems(s);o.st=Object.assign({},o.st||{});
    (o.done||[]).forEach(id=>{if(!o.st[id])o.st[id]='a'});
    let id2=b.dataset.it; if(a==='plus'){const nx=s.items.find(it=>!o.st[it.id]);if(!nx)return;id2=nx.id}
    const cur=o.st[id2]||'', nxt=a==='plus'?'a':{'':'a',a:'i',i:'c',c:'n',n:''}[cur];
    if(nxt)o.st[id2]=nxt;else delete o.st[id2];
    if((nxt==='a'||nxt==='i')&&cur!=='a'&&cur!=='i')o.tEx=Date.now();
    o.done=s.items.filter(it=>o.st[it.id]==='a'||o.st[it.id]==='i').map(it=>it.id);o.ex=o.done.length;
    if(!o.dem&&(o.ex>0))o.dem='r';save('seances',s.id);render();return}
  if(a==='flag'){const [s,o]=obsMut(sid);const f=b.dataset.f;let fl=(o.flags||[]).slice();fl=fl.includes(f)?fl.filter(x=>x!==f):fl.concat(f);o.flags=fl;save('seances',s.id);render();return}
  if(a==='setflags'){const c=S.classes[S.editClass];const v=$('e-flags').value.split(',').map(x=>x.trim()).filter(Boolean);c.flags=v.length?v:DEF_FLAGS.slice();save('classes',c.id);render();return}
  if(a==='pick'){const it=b.dataset.it;S.pick=S.pick.includes(it)?S.pick.filter(x=>x!==it):S.pick.concat(it);render();return}
  if(a==='newchapform'){S.newChap=true;render();return}
  if(a==='closechap'){S.newChap=false;render();return}
  if(a==='newchap'){const t=(S.form.chtitre||'').trim();if(!t){$('ch-titre').focus();return}const na=Math.max(0,Math.min(15,parseInt(S.form.chact??3)||0)),ne=Math.max(0,Math.min(80,parseInt(S.form.chex??21)||0));
    const items=[];for(let i=1;i<=na;i++)items.push({id:'a'+i,label:'A'+i,type:'act'});for(let i=1;i<=ne;i++)items.push({id:'e'+i,label:String(i),type:'ex'});
    const ch={id:uid(),classId:S.classId,titre:t,items,hors:{},cree:Date.now()};S.chapitres[ch.id]=ch;S.chapId=ch.id;S.newChap=false;delete S.form.chtitre;S.form.chap=ch.id;S.pick=[];save('chapitres',ch.id);render();return}
  if(a==='additem'){const ch=curChap();if(!ch)return;const v=$('ch-add').value.split(',').map(x=>x.trim()).filter(Boolean);
    v.forEach(l=>{const num=/^\d+$/.test(l);const id=num?'e'+l:'x'+uid();if(ch.items.some(it=>it.id===id))return;ch.items.push({id,label:l,type:num?'ex':'autre'})});save('chapitres',ch.id);render();return}
  if(a==='delchap'){S.confirm=null;remove('chapitres',id);if(S.chapId===id)S.chapId=null;render();return}
  if(a==='chst'){S.chStudent=S.chStudent===sid?null:sid;render();return}
  if(a==='cell'){const ch=curChap();if(!ch)return;ch.hors=ch.hors||{};let h=(ch.hors[sid]||[]).slice();const it=b.dataset.it;h=h.includes(it)?h.filter(x=>x!==it):h.concat(it);ch.hors[sid]=h;save('chapitres',ch.id);render();return}
  if(a==='ex'||a==='plus'){const [s,o]=obsMut(sid);const n=a==='plus'?Math.min(s.nbEx,(o.ex||0)+1):(+b.dataset.n===(o.ex||0)?+b.dataset.n-1:+b.dataset.n);
    if(n>(o.ex||0))o.tEx=Date.now(); o.ex=n; if(!o.dem&&n>0)o.dem='r'; save('seances',s.id);render();return}
  if(a==='note'){S.openNote=S.openNote===sid?null:sid;render();if(S.openNote){const t=$('note-'+sid);t&&t.focus()}return}
  if(a==='newseance'){const ch=formChap(),f=S.form,date=f.date||today(),g=parseInt(f.groupe)||null;let items=null,nb;
    if(ch){if(!S.pick.length)return;items=ch.items.filter(it=>S.pick.includes(it.id)).map(it=>({id:it.id,label:it.label,type:it.type}));nb=items.length}else{items=parseEx(f.nb||'1-5');if(!items.length){const el=$('f-nb');if(el){el.focus();el.select()}return}nb=items.length}
    const titre=(f.titre||'').trim()||(ch?ch.titre+' · '+fmtItems(items):fmtItems(items)+' · '+fdate(date));
    const s={id:uid(),classId:S.classId,groupe:g,chapId:ch?ch.id:null,items,titre,nbEx:nb,date,debut:Date.now(),fin:null,obs:{}};S.form={};S.pick=[];S.seances[s.id]=s;S.seanceId=s.id;save('seances',s.id);render();scrollTo(0,0);return}
  if(a==='open'){S.seanceId=id;ensureItems(S.seances[id]);render();scrollTo(0,0);return}
  if(a==='leave'){S.seanceId=null;S.openNote=null;render();return}
  if(a==='finish'){const s=S.seances[S.seanceId];s.fin=Date.now();save('seances',s.id);render();return}
  if(a==='reopen'){const s=S.seances[S.seanceId];s.fin=null;if(!enCours(s))s.debut=Date.now();save('seances',s.id);render();return}
  if(a==='ask'){S.confirm=id;render();return}
  if(a==='cancel'){S.confirm=null;render();return}
  if(a==='delseance'){S.confirm=null;remove('seances',id);if(S.seanceId===id)S.seanceId=null;render();return}
  if(a==='profil'){S.profil=S.profil===sid?null:sid;render();return}
  if(a==='csv'){exportCsv();return}
  if(a==='appr'){S.appr=!S.appr;S.apOut=null;S.apMiss=0;render();return}
  if(a==='apgen'){render();return}
  if(a==='apsave'){const c=S.classes[S.classId];saveFile('appreciations-'+c.nom.replace(/[^\w-]+/g,'_')+'.txt',apprText(),'text/plain');return}
  if(a==='aprename'){S.apIn=$('ap-in').value;const r=renameText(S.apIn);S.apOut=r.out;S.apMiss=r.miss;render();return}
  if(a==='apcopy'){const t=$(b.dataset.src);const msg=$('ap-msg-'+b.dataset.src);const ok=()=>{if(msg)msg.textContent='Copié.'};
    const fb=()=>{t.focus();t.select();try{document.execCommand('copy');ok()}catch(e){if(msg)msg.textContent='Texte sélectionné : utilisez Copier.'}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,fb);else fb();return}
  if(a==='backup'){exportBackup();return}
  if(a==='noimport'){S.pendingImport=null;render();return}
  if(a==='doimport'){const d=S.pendingImport;S.classes=d.classes||{};S.seances=d.seances||{};S.chapitres=d.chapitres||{};
    ['classes','seances','chapitres'].forEach(c=>Object.keys(S[c]).forEach(id=>S[c][id].id=id));
    S.pendingImport=null;S.seanceId=null;S.chapId=null;S.classId=null;try{saveLocal();S.msg='Sauvegarde restaurée.'}catch(e){} render();return}
  if(a==='newclass'){const nom=$('c-nom').value.trim();if(!nom){$('c-nom').focus();return}const g=+$('c-grp').value||0;const c={id:uid(),nom,eleves:parseNames($('c-eleves').value).map(e=>g?Object.assign(e,{groupe:g}):e)};S.addMsg=null;S.classes[c.id]=c;S.classId=c.id;S.editClass=c.id;save('classes',c.id);render();return}
  if(a==='edit'){S.addMsg=null;S.editClass=id;S.confirm=null;render();scrollTo(0,0);return}
  if(a==='closeedit'){S.editClass=null;render();return}
  if(a==='rename'){const c=S.classes[S.editClass];const v=$('e-nom').value.trim();if(v){c.nom=v;save('classes',c.id);render()}return}
  if(a==='addst'){const c=S.classes[S.editClass];const g=+$('e-grp').value||0;const names=parseNames($('e-add').value);if(!names.length)return;
    c.eleves=(c.eleves||[]).slice();const idx=new Map(c.eleves.map(e=>[normH(e.nom),e]));let add=0,upd=0;
    names.forEach(n=>{const old=idx.get(normH(n.nom));if(old){if(g&&old.groupe!==g){old.groupe=g;upd++}}else{if(g)n.groupe=g;c.eleves.push(n);idx.set(normH(n.nom),n);add++}});
    S.addMsg=`${add} élève${add>1?'s':''} ajouté${add>1?'s':''}${g?' au groupe '+g:''}`+(upd?`, ${upd} déjà dans la classe placé${upd>1?'s':''} dans le groupe ${g}`:'')+(names.length-add-upd>0?`, ${names.length-add-upd} déjà présent${names.length-add-upd>1?'s':''} sans changement`:'')+'.';
    save('classes',c.id);render();return}
  if(a==='grp'){const c=S.classes[S.editClass];const e=c.eleves.find(x=>x.id===sid);const g=+b.dataset.g;if(g)e.groupe=g;else delete e.groupe;save('classes',c.id);render();return}
  if(a==='delst'){const c=S.classes[S.editClass];c.eleves=c.eleves.filter(e=>e.id!==sid);S.confirm=null;save('classes',c.id);render();return}
  if(a==='delclass'){S.confirm=null;chapsOf(id).forEach(x=>remove('chapitres',x.id));classSeances(id).forEach(s=>remove('seances',s.id));remove('classes',id);if(S.editClass===id)S.editClass=null;if(S.classId===id)S.classId=null;render();return}
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-act]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset&&t.dataset.target&&t.type==='file'){const f=t.files&&t.files[0];const ta=$(t.dataset.target);const msg=$('csvmsg-'+t.dataset.target);t.value='';if(!f||!ta)return;
    readTextFile(f,txt=>{const n=namesFromTable(txt);if(!n.length){if(msg)msg.textContent='Aucun nom trouvé dans ce fichier.';return}ta.value=n.join('\n');if(msg)msg.textContent=n.length+' élèves lus. Vérifiez la liste puis validez.'});return}
  if(t.id==='f-restore'){if(t.files&&t.files[0])importBackup(t.files[0]);t.value='';return}

  if(t.id==='sel-sort'){S.sort=t.value;render()}
  if(t.id==='sel-seuil'){S.seuil=+t.value;render()}
});
let noteT=null;

document.addEventListener('focusout',ev=>{if(ev.target.id==='ap-consigne'){S.deferred=false;setTimeout(render,200);return}if(ev.target.dataset&&ev.target.dataset.keep&&(S.deferred||ev.target.dataset.act==='notein')){S.deferred=false;setTimeout(render,200)}});

async function exportCsv(){
  const c=S.classes[S.classId]; const ss=classSeances(S.classId);
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['Classe','Date','Effectif','Séance','Élève','Absent','Mise en route','Autonomie','Faits seul','Faits avec aide','Correction copiée','Pas cherchés','Exercices faits','Exercices prévus','Signalements','Note'].map(q).join(';')];
  ss.forEach(s=>sortedStudents(c).filter(e=>concerne(s,e)).forEach(e=>{const o=obsOf(s,e.id);lines.push([c.nom,s.date,grpLabel(s.groupe),s.titre,e.nom,o.abs?'oui':'',o.dem?DEM[o.dem][0]:'',o.abs||autoOf(o)==null?'':Math.round(autoOf(o)*100)+' %',o.abs?'':stCount(o).a,o.abs?'':stCount(o).i,o.abs?'':stCount(o).c,o.abs?'':stCount(o).n,o.abs?'':(o.ex||0),s.nbEx,(o.flags||[]).join(', '),o.note||''].map(q).join(';'))}));
  const csv='\ufeff'+lines.join('\r\n'); const name='suivi-'+c.nom.replace(/[^\w-]+/g,'_')+'.csv';
  saveFile(name,csv,'text/csv');
}
function saveFile(name,text,type){
  const blob=new Blob([text],{type:type+';charset=utf-8'});const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);
}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+'h'+p(d.getMinutes())}
function exportBackup(){
  const data={app:'carnet-suivi-classe',version:1,exporte:new Date().toISOString(),classes:S.classes,seances:S.seances,chapitres:S.chapitres};
  saveFile('sauvegarde-suivi_'+stamp()+'.json',JSON.stringify(data),'application/json');
  try{localStorage.setItem('suivi-hl-lastbackup',String(Date.now()))}catch(e){}
  S.msg='Sauvegarde créée. Rangez le fichier dans Fichiers ou iCloud Drive.';render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='carnet-suivi-classe'||!d.classes)throw 0;
      S.pendingImport=d;S.msg=null;render()}catch(e){S.msg='Ce fichier n’est pas une sauvegarde du carnet.';render()}};
  r.readAsText(file);
}

})();
